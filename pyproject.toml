[project]
name = "flowforge-mcp"
version = "0.1.0"
description = "MCP-first task and work-unit management with SQLite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ThisIsCKM-org" }]
dependencies = [
  "fastmcp>=2.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
flowforge-mcp = "flowforge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

